version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./https/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./https/certs:/etc/nginx/certs:ro
    networks:
      - skeletor-network
    depends_on:
      - skeletor
    restart: unless-stopped

  skeletor:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=c2
      - DB_USER=skeletor
      - DB_PASSWORD=letredin
    volumes:
      - ./logs:/c2/logs
      - ./files:/c2/files
    networks:
      - skeletor-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=c2
      - POSTGRES_USER=skeletor
      - POSTGRES_PASSWORD=letredin
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skeletor -d c2"]
      interval: 60s
      timeout: 15s
      retries: 5
    networks:
      - skeletor-network
    restart: unless-stopped

networks:
  skeletor-network:
    driver: bridge

volumes:
  db-data:
    driver: local